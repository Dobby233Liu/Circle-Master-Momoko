<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title data-i18n="appName">Circle M@ster Momoko</title>
    <meta property="og:title" content="Circle M@ster Momoko" />
    <meta property="og:description" content="トゲトゲなさんかくを、まあるくしてね。" />
    <meta name="theme-color" content="#efb864" />
    <meta property="og:image" content="https://m-masaki72.github.io/Circle-Master-Momoko/ScreenShot.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://m-masaki72.github.io/Circle-Master-Momoko/" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="manifest" href="./app.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="normal" />
</head>
<!-- Use h-dvh (dynamic viewport height) for better mobile support -->
<body class="select-none overflow-auto overflow-x-hidden font-sans-mine bg-yellow-101 bg-(image:--bg-shapes) bg-center">
    <div id="confetti-container" class="fixed left-0 bottom-0 z-100 pointer-events-none"></div>

    <div class="h-dvh flex flex-col items-center py-2">
        <!-- Compact Header -->
        <header id="header-area" class="text-center z-10 flex flex-col items-center shrink-0 gap-2">
            <h1 class="text-2xl md:text-4xl lg:text-5xl font-bold text-momoko drop-shadow-xs bg-white/80 px-6 py-2 rounded-full backdrop-blur-xs shadow-xs">
                <i class="fa-solid fa-shapes text-orange-400"></i>
                <span data-i18n="appName">Circle M@ster Momoko</span>
            </h1>
            <p class="flex items-center gap-4 text-gray-500 text-xs md:text-sm">
                <span class="bg-white/60 px-3 py-1 rounded-md font-bold" data-i18n="gameObjective">トゲトゲなさんかくを、まあるくしてね。</span>
                <!-- Guide Button moved here to save vertical space -->
                <button type="button" id="guide-toggle" class="header-button">
                    <i id="guide-toggle-icon" class="fa-regular fa-circle"></i>
                    <span id="guide-toggle-text" data-i18n="guideToggleLabel" data-i18n-context="off">ガイド: OFF</span>
                </button>
                <span class="header-button gap-0.5 active:scale-none">
                    <label for="language-selector" data-i18n="languageSelectorLabel">言語：</label>
                    <select id="language-selector" disabled="true" required>
                        <option selected>日本語</option>
                    </select>
                </span>
            </p>
        </header>
    
        <!-- Game Area (Auto-expanding) -->
        <div class="my-2 grow flex items-center w-auto max-w-full h-full min-h-75 aspect-square rounded-3xl relative">
            <main id="canvas-container" class="w-full h-auto aspect-square bg-white rounded-3xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.15),0_8px_10px_-6px_rgba(0,0,0,0.1)] transition-all duration-200 ease-out">
                <canvas id="gameCanvas" class="cursor-crosshair touch-none"></canvas>
            </main>
            
            <div class="absolute bottom-0 z-5 overflow-hidden w-full rounded-b-3xl">
                <!-- Result Overlay -->
                <article id="result-overlay" class="hidden w-full backdrop-blur-xs bg-white/95 border-t-2 border-orange-100 px-4 py-6 flex-col justify-center gap-4">
                    <!-- Score Row -->
                    <div class="flex items-center gap-4 w-full font-bold">
                        <div class="flex flex-col items-center min-w-25">
                            <span id="score-label" class="text-gray-400 text-xs uppercase tracking-widest" data-i18n="resultScoreLabel">Score</span>
                            <span id="score" class="text-5xl font-black text-momoko leading-none" data-i18n="resultScoreDisplay" data-i18n-interpolation-data='{"count": 0}'>{{count}}%</span>
                        </div>
                        
                        <div class="h-12 w-1 bg-orange-200 rounded-full"></div> 
    
                        <div id="message" class="text-gray-600 leading-tight text-lg"></div>
                    </div>
    
                    <!-- Action Buttons -->
                    <div class="flex gap-3 w-full font-bold">
                        <!-- Twitter Button (Fixed Icon) -->
                        <button type="button" id="share-on-twitter" class="result-button flex-1 bg-black hover:opacity-80">
                            <!-- Used standard fa-twitter (bird) for guaranteed visibility -->
                            <i class="fa-brands fa-twitter text-xl text-white"></i>
                            <span data-i18n="shareTweet">Post</span>
                        </button>
                        
                        <!-- Retry Button -->
                        <button type="button" id="reset-game" class="result-button flex-2 bg-momoko">
                            <i class="fa-solid fa-rotate-right text-xl"></i>
                            <span data-i18n="retry">もう一回</span>
                        </button>
                    </div>
                </article>
            </div>
        </div>
    
        <!-- Minimal Footer Guide -->
        <footer id="footer-area" class="mt-auto text-gray-400 text-xs md:text-sm text-center bg-white/60 px-6 py-1 rounded-full backdrop-blur-xs font-bold z-10 shrink-0" data-i18n="acceptedInputTypes">
            <i class="fa-solid fa-computer-mouse mr-1"></i>マウス / <i class="fa-solid fa-fingerprint mx-1"></i>指で描いてね
        </footer>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
