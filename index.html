<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="appName">Circle M@ster Momoko</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (latest) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/i18next@25.8.0/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@8.2.0/dist/umd/i18nextBrowserLanguageDetector.min.js"></script>
    <style>
        body {
            touch-action: none; /* Prevent scrolling */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffeec2; 
            /* Background Pattern */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.6'%3E%3Cpath d='M10 10h10v10H10z'/%3E%3Ccircle cx='40' cy='40' r='5'/%3E%3Cpath d='M40 10l5 10h-10z'/%3E%3Cpath d='M10 40h10v10H10z'/%3E%3Cpath d='M25 50l5 10h-10z'/%3E%3Ccircle cx='50' cy='20' r='3'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 120px 120px;
            overflow: hidden; /* Prevent body scroll completely */
        }
        
        /* Canvas Styling */
        #canvas-container {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            background: white;
            border-radius: 1.5rem;
            cursor: crosshair;
            transition: all 0.2s ease-out;
            /* Ensure it doesn't overflow */
            max-width: 100%;
            max-height: 100%;
        }

        #result-overlay {
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(8px);
            border-radius: 0 0 1.5rem 1.5rem; /* Match canvas bottom rounded corners */
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 100%); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .momoko-color { color: #EFB864; }
        .momoko-bg { background-color: #EFB864; }
        
        .confetti {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #f00;
            animation: fall linear forwards;
            z-index: 100;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<!-- Use h-dvh (dynamic viewport height) for better mobile support -->

        </h1>
        <div class="flex items-center gap-4 mt-2">

                トゲトゲなさんかくを、まあるくしてね。
            </p>
            <!-- Guide Button moved here to save vertical space -->
            <button id="guide-toggle" onclick="toggleGuide()" class="bg-white text-gray-500 border border-gray-200 px-3 py-1 rounded-full text-xs md:text-sm font-bold shadow-sm hover:bg-orange-50 transition-colors flex items-center gap-2 active:scale-95">

                <span id="guide-toggle-text" data-i18n="guideToggleLabel" data-i18n-context="off">ガイド: OFF</span>
            </button>
            <span class="bg-white text-gray-500 border border-gray-200 px-3 py-1 rounded-full text-xs md:text-sm font-bold shadow-sm transition-colors flex items-center gap-1">
                <label for="language-selector" data-i18n="languageSelectorLabel">言語：</label>
                <select id="language-selector" disabled="true" required></select>
            </span>
        </div>
    </div>

    <!-- Game Area (Auto-expanding) -->
    <div id="game-area" class="relative flex-grow flex items-center justify-center w-full px-2">
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Result Overlay -->
            <div id="result-overlay" class="hidden absolute bottom-0 left-1/2 transform -translate-x-1/2 w-full border-t border-orange-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-6 pt-6 px-4 flex flex-col items-center justify-center gap-4 z-20">
                
                <!-- Score Row -->
                <div class="flex items-center justify-center gap-4 w-full">
                    <div class="flex flex-col items-center min-w-[100px]">

                    </div>
                </div>

                <!-- Action Buttons -->

                    <!-- Twitter Button (Fixed Icon) -->
                    <button onclick="shareTwitter()" class="flex-1 bg-black text-white px-4 py-3 rounded-full font-bold hover:opacity-80 transition-opacity shadow-md text-lg active:scale-95 transform transition-transform flex items-center justify-center gap-2">

                    <!-- Retry Button -->

    }).then(onI18nLoaded);
    // i18next.on("initialized", onI18nLoaded);
    i18next.on("loaded", onI18nLoaded);
    
    function applyI18nToTextOf(elem) {
        if (!elem?.dataset?.i18n)
            return;
        
        const context = elem.dataset.i18nContext;
        let interpolationData = {};
        if (elem.dataset.i18nInterpolationData) {
            try {
                interpolationData = JSON.parse(elem.dataset.i18nInterpolationData);
                if (typeof interpolationData !== "object")
                    throw new Error('typeof interpolationData !== "object"');
            }
            catch (err) {
                console.error("Bad interpolation data for:", elem, err);
                return false;
            }
        }
        
        const str = i18next.t(elem.dataset.i18n, {
            context: context,
            ...interpolationData
        });
        elem.innerHTML = str;
        return true;
    }
    function applyI18nToTextOfAll(root = document) {
        for (const elem of root.querySelectorAll("[data-i18n]"))
            applyI18nToTextOf(elem);
    }
    function onI18nAttrChanged(records) {
        for (const record of records)
            applyI18nToTextOf(record.target);
    }
    
    function onLangChange() {
        document.documentElement.lang = i18next.language;
        applyI18nToTextOfAll();
    }
    i18next.on("languageChanged", onLangChange);
    function onI18nLoaded() {
        onLangChange();
        
        i18nObserver.observe(document, {
            subtree: true,
            attributes: ["data-i18n", "data-i18n-context", "data-i18n-interpolation-data"]
        });
        
        languageSelector.replaceChildren();
        for (const lng of TRUE_SUPPORTED_LANGS) {
            const option = languageSelector.appendChild(document.createElement("option"));
            option.value = lng;
            option.innerText = i18next.t("languageName", { lng });
            if (lng == i18next.resolvedLanguage) option.selected = true;
        }
        languageSelector.addEventListener("change", onLanguageSelection);
        languageSelector.disabled = false;
    }
    function onLanguageSelection(ev) {
        i18next.changeLanguage(ev.target.value);
    }
    
    function setTextLocalizable(elem, key, options) {
        if (!key) {
            delete elem.dataset.i18n;
            return;
        }
        elem.dataset.i18n = key;
        elem.dataset.i18nContext = options?.context;
        if (!options?.interpolation)
            delete elem.dataset.i18nInterpolationData;
        else
            elem.dataset.i18nInterpolationData = JSON.stringify(options.interpolation);
    }

    const canvas = document.getElementById('gameCanvas');
    const container = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');
    const resultOverlay = document.getElementById('result-overlay');
    const scoreLabel = document.getElementById('score-label');
    const scoreDiv = document.getElementById('score');
    const messageDiv = document.getElementById('message');
    const guideBtn = document.getElementById('guide-toggle');
    const guideBtnIcon = document.getElementById('guide-toggle-icon');
    const guideBtnText = document.getElementById('guide-toggle-text');

    let isDrawing = false;
    let points = [];
    let canvasSize = 0;
    let isGuideMode = false;
    let currentScore = 0;
    let currentMessage = "";

    const MIN_POINT_COUNT = 20;
    
    // Dynamic styles based on size
    let lineWidthUser = 12;
    let lineWidthGuide = 24;
    const THICKNESS_RATIO = 0.10; 

    function init() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Mouse
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDrawing);
        canvas.addEventListener('mouseleave', () => { if (isDrawing) endDrawing(); });

        // Touch
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDrawing(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        }, { passive: false });
        canvas.addEventListener('touchend', endDrawing);
    }

    function toggleGuide() {
        isGuideMode = !isGuideMode;
        if (isGuideMode) {
            guideBtnIcon.className = "fa-solid fa-check-circle text-orange-500";
            guideBtnText.className = "text-orange-500";
            setTextLocalizable(guideBtnText, "guideToggleLabel", { context: "on" });
            guideBtn.classList.add('border-orange-200', 'bg-orange-50');
        } else {
            guideBtnIcon.className = "fa-regular fa-circle";
            guideBtnText.className = "";
            setTextLocalizable(guideBtnText, "guideToggleLabel", { context: "off" });
            guideBtn.classList.remove('border-orange-200', 'bg-orange-50');
        }
        resetGame();
    }

    function resizeCanvas() {
        const gameArea = document.getElementById('game-area');
        const header = document.getElementById('header-area');
        const footer = document.getElementById('footer-area');
        
        // Calculate available space
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        
        // Subtract vertical UI elements + vertical margins + body padding
        const uiHeight = header.offsetHeight + footer.offsetHeight + 16 + 16;
        const availableHeight = windowHeight - uiHeight;
        
        // Determine the maximum possible square size
        // We allow it to go much larger now (up to 800px or 95% of screen)
        const maxDimension = Math.min(windowWidth - 24, availableHeight);
        
        // Clamp min size
        canvasSize = Math.max(300, maxDimension);
        
        // Update styling params
        // Adjusted: Made the lines thinner relative to canvas size for a cleaner look
        lineWidthUser = Math.max(6, canvasSize * 0.02); 
        lineWidthGuide = lineWidthUser * 2;

        const dpr = window.devicePixelRatio || 1;
        const intendedImageSize = canvasSize * dpr;
        let resized = false;
        if (canvas.width != intendedImageSize || canvas.height != intendedImageSize) {
            canvas.width = intendedImageSize;
            canvas.height = intendedImageSize;
            resized = true;
        }
        
        // Set style dimensions
        canvas.style.width = `${canvasSize}px`;
        canvas.style.height = `${canvasSize}px`;
        container.style.width = `${canvasSize}px`;
        container.style.height = `${canvasSize}px`;

        ctx.scale(dpr, dpr);

        if (resized) {
            if (!isDrawing && points.length >= MIN_POINT_COUNT) {
                setupBrush();
                showResultGraphics();
            } else {
                drawHint();
                setupBrush();
                preparePointsLine(true);
            }
        }
    }

    function drawHint() {
        ctx.clearRect(0, 0, canvasSize, canvasSize); // Clear before drawing hint

        if (isGuideMode) {
            ctx.beginPath();
            ctx.strokeStyle = '#FED7AA'; 
            ctx.lineWidth = lineWidthGuide; 
            ctx.setLineDash([]); 
            ctx.arc(canvasSize/2, canvasSize/2, canvasSize/3, 0, Math.PI * 2);
            ctx.stroke();
            
            // Removed center square hint
        } else {
            // Removed center square hint
        }
    }

    class Point {
        constructor(x, y) {
            this.x = x;
            this.y = y;
        }
        
        static fromCanvasPos(x, y) {
            return new this(x / canvasSize, y / canvasSize);
        }
        static fromCanvasClientPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return this.fromCanvasPos(clientX - rect.left, clientY - rect.top);
        }
        
        getOnCanvasX() {
            return this.x * canvasSize;
        }
        getOnCanvasY() {
            return this.y * canvasSize;
        }
    }
    function getPos(e) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return Point.fromCanvasClientPos(clientX, clientY);
    }

    function setupBrush() {
        ctx.beginPath();
        ctx.strokeStyle = '#EFB864'; 
        ctx.lineWidth = lineWidthUser;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }
    function startDrawing(e) {
        if (!resultOverlay.classList.contains('hidden')) resetGame();
        isDrawing = true;
        points = [];
        resultOverlay.classList.add('hidden');
        resultOverlay.classList.remove('animate-slide-up');
        ctx.clearRect(0, 0, canvasSize, canvasSize);
        drawHint(); 
        
        const pos = getPos(e);
        points.push(pos);
        
        setupBrush();
        ctx.moveTo(pos.getOnCanvasX(), pos.getOnCanvasY());
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getPos(e);
        points.push(pos);
        ctx.lineTo(pos.getOnCanvasX(), pos.getOnCanvasY());
        ctx.stroke();
    }

    function endDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        if (points.length < MIN_POINT_COUNT) return;
        evaluateCircle();
    }
    
    function preparePointsLine(doStrokeForEveryPoint) {
        if (points.length <= 0) return;
        ctx.moveTo(points[0].getOnCanvasX(), points[0].getOnCanvasY());
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].getOnCanvasX(), points[i].getOnCanvasY());
            if (doStrokeForEveryPoint)
                ctx.stroke();
        }
    }

    function evaluateCircle() {
        let sumX = 0, sumY = 0;
        points.forEach(p => { sumX += p.x; sumY += p.y; });
        const centerX = sumX / points.length;
        const centerY = sumY / points.length;

        const distances = points.map(p => Math.sqrt((p.x - centerX) ** 2 + (p.y - centerY) ** 2));
        const avgRadius = distances.reduce((a, b) => a + b, 0) / distances.length;

        const safeZoneHalfWidth = avgRadius * (THICKNESS_RATIO / 2); 
        
        let errorSum = 0;
        distances.forEach(d => {
            const diff = Math.abs(d - avgRadius);
            const adjustedDiff = Math.max(0, diff - safeZoneHalfWidth);
            errorSum += adjustedDiff;
        });
        
        const errorRate = errorSum / distances.length / avgRadius;

        const start = points[0];
        const end = points[points.length - 1];
        const gap = Math.sqrt((start.x - end.x) ** 2 + (start.y - end.y) ** 2);
        const adjustedGap = Math.max(0, gap - (avgRadius * THICKNESS_RATIO));
        const gapPenalty = (adjustedGap / avgRadius) * 0.1; 

        let rawScore = 100 - (errorRate * 250 + gapPenalty * 100); 
        let score = Math.round(rawScore);
        score = Math.max(0, Math.min(100, score));

        showResult(score, centerX, centerY, avgRadius);
    }

    let [resultCx, resultCy, resultR] = [0, 0, 0];
    function showResultGraphics(cx, cy, r) {
        resultCx = cx ?? resultCx;
        resultCy = cy ?? resultCy;
        resultR = r ?? resultR;
        cx = resultCx * canvasSize;
        cy = resultCy * canvasSize;
        r = resultR * canvasSize;
        
        ctx.clearRect(0, 0, canvasSize, canvasSize);

        if (isGuideMode) {
             ctx.save();
             ctx.beginPath();
             ctx.strokeStyle = '#FFF7ED'; 
             ctx.lineWidth = lineWidthGuide; 
             ctx.arc(canvasSize/2, canvasSize/2, canvasSize/3, 0, Math.PI * 2);
             ctx.stroke();
             ctx.restore();
        }

        const visualThickness = r * THICKNESS_RATIO;

        ctx.save();
        
        // 1. Ideal "Thick" Circle
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(239, 184, 100, 0.4)'; 
        ctx.lineWidth = visualThickness; 
        ctx.stroke();

        // 2. XOR with User's Drawing
        ctx.globalCompositeOperation = 'xor';
        ctx.beginPath();
        preparePointsLine();
        ctx.strokeStyle = 'rgba(239, 184, 100, 0.4)';
        ctx.lineWidth = visualThickness; 
        ctx.stroke();

        ctx.restore();
        
        // --- OUTLINE LAYER ---
        ctx.beginPath();
        ctx.strokeStyle = '#F8A5C2'; 
        ctx.lineWidth = lineWidthUser * 0.4;
        ctx.setLineDash([lineWidthUser, lineWidthUser]);
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.strokeStyle = '#555';
        ctx.lineWidth = lineWidthUser * 0.6;
        preparePointsLine();
        ctx.stroke();
    }
    
    function showResult(score, cx, cy, r) {
        currentScore = score;

        showResultGraphics(cx, cy, r);

        // Update Text
        setTextLocalizable(scoreLabel, "resultScoreLabel", {
            interpolation: { count: score }
        });
        setTextLocalizable(scoreDiv, "resultScoreDisplay", {
            interpolation: { count: score }
        });
        
        let msgContext = 0;
        let colorClass = "text-gray-600";

        // Note that we assume 5 entries...
        const msgIndex = Math.floor(Math.random() * 5);
        if (score == 100) {
            msgContext = 100;
            colorClass = "text-orange-500";
            triggerConfetti(score); 
        } else if (score >= 90) {
            msgContext = 90;
            colorClass = "text-orange-400";
            triggerConfetti(score); 
        } else if (score >= 80) {
            msgContext = 80;
        } else if (score >= 60) {
            msgContext = 60;
        } else {
            msgContext = 0;
        }

        const msg = "resultComment_" + msgContext + "." + msgIndex;
        currentMessage = msg;
        setTextLocalizable(messageDiv, msg);
        messageDiv.className = `font-bold whitespace-normal break-words leading-tight text-lg md:text-xl ${colorClass}`;
        
        resultOverlay.classList.remove('hidden');
        resultOverlay.classList.add('animate-slide-up');
    }

    function shareTwitter() {
        const text = i18next.t("shareTweetText", {
            score: currentScore,
            message: currentMessage
        });
        const url = window.location.href; 
        const twitterUrl = new URL("https://twitter.com/intent/tweet");
        twitterUrl.searchParams.set("text", text);
        twitterUrl.searchParams.set("url", url);
        window.open(twitterUrl, '_blank');
    }

    function resetGame() {
        isDrawing = false;
        points = [];
        resultOverlay.classList.add('hidden');
        resultOverlay.classList.remove('animate-slide-up');
        ctx.clearRect(0, 0, canvasSize, canvasSize);
        drawHint();
    }
    
    function triggerConfetti(score) {
        const colors = ['#EFB864', '#F8A5C2', '#60A5FA', '#FCD34D', '#FFFFFF'];
        const count = 100; 
        
        for (let i = 0; i < count; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-20px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            let shape = 'triangle';
            const r = Math.random();
            if (score >= 100) {
                if (r < 0.33) shape = 'circle';
                else if (r < 0.66) shape = 'square';
            } else if (score >= 90) {
                if (r < 0.5) shape = 'square';
            }
            
            if (shape === 'triangle') confetti.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
            else if (shape === 'circle') { confetti.style.borderRadius = '50%'; confetti.style.clipPath = 'none'; }
            else if (shape === 'square') { confetti.style.borderRadius = '0'; confetti.style.clipPath = 'none'; }

            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3500);
        }
    }

    init();

</script>
</body>
</html>
