<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="appName">Circle M@ster Momoko</title>
    <!-- FontAwesome (latest) -->
    <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free@6/css/all.min.css" media="print" onload="this.media='all'" />
    <script src="https://unpkg.com/i18next@25.8.0/dist/umd/i18next.min.js" defer></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@8.2.0/dist/umd/i18nextBrowserLanguageDetector.min.js" defer></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans-mine: 'Helvetica Neue', Arial, var(--font-sans);
            --color-yellow-101: #ffeec2;
            --bg-shapes: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 60 60"><g fill="%23ffffff" fill-opacity=".6" fill-rule="evenodd"><path d="M10 10h10v10H10z"/><circle cx="40" cy="40" r="5"/><path d="m40 10 5 10H35zM10 40h10v10H10zm15 10 5 10H20z"/><circle cx="50" cy="20" r="3"/></g></svg>');
            --color-momoko: #EFB864;
            --shadow-xl-mine: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --animate-fade-in-and-slide-up: fade-in-and-slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            --animate-confetti-fall: confetti-fall linear forwards;
        }
        
        @keyframes fade-in-and-slide-up {
            from { opacity: 0; transform: translate3d(0, 100%, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        
        @keyframes confetti-fall {
            from { bottom: calc(100% + 20px); }
            to { bottom: 0; --tw-rotate-z: rotateZ(720deg); }
        }
        
        @layer base {
            button:not(:disabled), [role="button"]:not(:disabled) {
                @apply cursor-pointer;
            }
        }
        
        @layer components {
            #gameCanvas.game-canvas-downscaled {
                image-rendering: pixelated;
            }
            
            .confetti {
                @apply absolute pointer-events-none w-[14px] h-[14px] animate-confetti-fall transform-gpu;
            }
            .confetti.confetti-triangle {
                @apply rounded-none;
                clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            }
            .confetti.confetti-circle {
                @apply rounded-full;
                clip-path: none;
            }
            .confetti.confetti-square {
                @apply rounded-none;
                clip-path: none;
            }
        }
    </style>
    <!-- Tailwind CSS (ideally we wouldn't use it like this, unluckily we ship as a zero-build process single file) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4" blocking="render"></script>
</head>
<!-- Use h-dvh (dynamic viewport height) for better mobile support -->
<body class="select-none overflow-auto overflow-x-hidden font-sans-mine bg-yellow-101 bg-(image:--bg-shapes)">
    <div id="confetti-container" class="fixed top-0 left-0 pointer-events-none z-100 w-dvw h-dvh"></div>

    <div class="h-dvh flex flex-col items-center py-2">
        <!-- Compact Header -->
        <header id="header-area" class="text-center z-10 flex flex-col items-center shrink-0 gap-2">
            <h1 class="text-2xl md:text-4xl lg:text-5xl font-bold text-momoko drop-shadow-xs bg-white/80 px-6 py-2 rounded-full backdrop-blur-xs shadow-xs">
                <i class="fa-solid fa-shapes text-orange-400"></i>
                <span data-i18n="appName">Circle M@ster Momoko</span>
            </h1>
            <div class="flex gap-4 text-gray-500 text-xs md:text-sm">
                <p class="bg-white/60 px-3 py-1 rounded-md font-bold" data-i18n="gameObjective">
                    トゲトゲなさんかくを、まあるくしてね。
                </p>
                <!-- Guide Button moved here to save vertical space -->
                <button type="button" id="guide-toggle" class="bg-white border border-gray-200 px-3 py-1 rounded-full font-bold shadow-xs hover:bg-orange-50 transition-colors active:scale-95">
                    <i id="guide-toggle-icon" class="fa-regular fa-circle mr-1"></i>
                    <span id="guide-toggle-text" data-i18n="guideToggleLabel" data-i18n-context="off">ガイド: OFF</span>
                </button>
                <span class="bg-white border border-gray-200 px-3 py-1 rounded-full font-bold shadow-xs hover:bg-orange-50 transition-colors">
                    <label for="language-selector" data-i18n="languageSelectorLabel">言語：</label>
                    <select id="language-selector" disabled="true" required></select>
                </span>
            </div>
        </header>
    
        <!-- Game Area (Auto-expanding) -->
        <main id="canvas-container" class="relative my-2 mx-6 flex flex-grow w-auto max-w-full h-full min-h-[300px] max-h-full aspect-square bg-white rounded-3xl shadow-xl-mine transition-all duration-200 ease-out overflow-hidden">
            <canvas id="gameCanvas" class="cursor-crosshair touch-none"></canvas>
            
            <!-- Result Overlay -->
            <div id="result-overlay" class="hidden absolute bottom-0 w-full backdrop-blur-xs bg-white/95 border-t border-orange-100 rounded-b-3xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-6 pt-6 px-4 flex flex-col items-center justify-center gap-4 z-20">
                <!-- Score Row -->
                <div class="flex items-center gap-4 w-full">
                    <div class="flex flex-col items-center min-w-[100px]">
                        <span id="score-label" class="text-gray-400 text-xs uppercase tracking-widest font-bold" data-i18n="resultScoreLabel">Score</span>
                        <span id="score" class="text-5xl font-black text-momoko leading-none" data-i18n="resultScoreDisplay" data-i18n-interpolation-data='{"count": 0}'>{{count}}%</span>
                    </div>
                    
                    <div class="h-12 w-1 bg-orange-200 rounded-full"></div> 

                    <div id="message" class="text-gray-600 font-bold leading-tight text-lg"></div>
                </div>

                <!-- Action Buttons -->
                <div class="flex w-full gap-3">
                    <!-- Twitter Button (Fixed Icon) -->
                    <button type="button" id="share-on-twitter" class="flex-1 bg-black text-white px-4 py-3 rounded-full font-bold hover:opacity-80 transition-opacity shadow-md text-lg active:scale-95 transform transition-transform flex items-center justify-center gap-2">
                        <!-- Used standard fa-twitter (bird) for guaranteed visibility -->
                        <i class="fa-brands fa-twitter text-xl text-white"></i>
                        <span data-i18n="shareTweet">Post</span>
                    </button>
                    
                    <!-- Retry Button -->
                    <button type="button" id="reset-game" class="flex-[2] bg-momoko text-white px-4 py-3 rounded-full font-bold hover:opacity-90 transition-opacity shadow-md text-lg active:scale-95 transform transition-transform flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right text-xl"></i>
                        <span data-i18n="retry">もう一回</span>
                    </button>
                </div>
            </div>
        </main>
    
        <!-- Minimal Footer Guide -->
        <footer id="footer-area" class="mt-auto text-gray-400 text-xs md:text-sm text-center bg-white/60 px-6 py-1 rounded-full backdrop-blur-xs font-bold z-10 shrink-0" data-i18n="acceptedInputTypes">
            <i class="fa-solid fa-computer-mouse mr-1"></i>マウス / <i class="fa-solid fa-fingerprint mx-1"></i>指で描いてね
        </footer>
    </div>

<script>
    const i18nObserver = new MutationObserver(onI18nAttrChanged);
    const languageSelector = document.getElementById("language-selector");
    function prepI18nLoad() {
        i18nObserver.disconnect();
        languageSelector.removeEventListener("change", onLanguageSelection);
        languageSelector.disabled = true;
    }
    prepI18nLoad();
    
    function applyI18nToTextOf(elem) {
        if (!elem?.dataset?.i18n)
            return;
        
        const context = elem.dataset.i18nContext;
        let interpolationData = {};
        if (elem.dataset.i18nInterpolationData) {
            try {
                interpolationData = JSON.parse(elem.dataset.i18nInterpolationData);
                if (typeof interpolationData !== "object")
                    throw new Error('typeof interpolationData !== "object"');
            } catch (err) {
                console.error("Bad interpolation data for:", elem, err);
                return false;
            }
        }
        
        const str = i18next.t(elem.dataset.i18n, {
            context: context,
            ...interpolationData
        });
        elem.innerHTML = str;
        return true;
    }
    function applyI18nToTextOfAll(root = document) {
        for (const elem of root.querySelectorAll("[data-i18n]"))
            applyI18nToTextOf(elem);
    }
    
    function onLangChange() {
        document.documentElement.lang = i18next.language;
        applyI18nToTextOfAll();
    }
    const I18N_ATTRS = ["data-i18n", "data-i18n-context", "data-i18n-interpolation-data"];
    function onI18nLoaded() {
        onLangChange();
        
        i18nObserver.observe(document, {
            subtree: true,
            attributes: true,
            attributeFilter: I18N_ATTRS
        });
        
        languageSelector.replaceChildren();
        for (const lng of TRUE_SUPPORTED_LANGS) {
            const option = languageSelector.appendChild(document.createElement("option"));
            option.value = lng;
            option.innerText = i18next.t("languageName", { lng });
            if (lng == i18next.resolvedLanguage) option.selected = true;
        }
        languageSelector.addEventListener("change", onLanguageSelection);
        languageSelector.disabled = false;
    }
    
    function onI18nAttrChanged(records) {
        const elems = new Set();
        for (const record of records) {
            if (I18N_ATTRS.includes(record.attributeName))
                elems.add(record.target);
        }
        for (const elem of elems)
            applyI18nToTextOf(elem);
    }
    
    function onLanguageSelection(ev) {
        i18next.changeLanguage(ev.target.value);
    }
    
    function setTextLocalizable(elem, key, options) {
        if (!key) {
            delete elem.dataset.i18n;
            return;
        }
        elem.dataset.i18n = key;
        if (options?.context)
            elem.dataset.i18nContext = options?.context;
        else
            delete elem.dataset.i18nContext;
        if (options?.interpolation)
            elem.dataset.i18nInterpolationData = JSON.stringify(options.interpolation);
        else
            delete elem.dataset.i18nInterpolationData;
    }
    
    const TRUE_SUPPORTED_LANGS = ["ja", "zh-Hans", "en"];
    async function initI18n() {
        i18next.use(i18nextBrowserLanguageDetector);
        i18next.on("languageChanged", onLangChange);
        i18next.on("initialized", onI18nLoaded);
        i18next.on("loaded", onI18nLoaded);
        await i18next.init({
            supportedLngs: ["ja", "zh-Hans", "zh-CN", "zh", "en"],
            fallbackLng: {
                zh: ["zh-Hans", "ja"],
                "zh-CN": ["zh-Hans", "ja"],
                default: ["ja"]
            },
            detection: {
                order: ["querystring", "navigator"],
                lookupQuerystring: "lang"
            },
            resources: JSON.parse(document.getElementById('i18n-resources').innerText)
        });
    }

    const canvas = document.getElementById('gameCanvas');
    const container = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');
    const resultOverlay = document.getElementById('result-overlay');
    const scoreLabel = document.getElementById('score-label');
    const scoreDiv = document.getElementById('score');
    const messageDiv = document.getElementById('message');
    const guideBtn = document.getElementById('guide-toggle');
    const guideBtnIcon = document.getElementById('guide-toggle-icon');
    const guideBtnText = document.getElementById('guide-toggle-text');

    let isDrawing = false;
    let points = [];
    let canvasSize = 0;
    let isGuideMode = false;
    let currentScore = 0;
    let currentMessage = "";

    const MIN_POINT_COUNT = 20;
    
    // Dynamic styles based on size
    let lineWidthUser = 12;
    let lineWidthGuide = 24;
    const THICKNESS_RATIO = 0.10; 

    async function init() {
        guideBtn.addEventListener("click", toggleGuide);
        document.getElementById("share-on-twitter").addEventListener("click", shareTwitter);
        document.getElementById("reset-game").addEventListener("click", resetGame);
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener("contextrestored", redrawCanvas);
        
        // Pointer events
        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', draw);
        canvas.addEventListener('pointerup', endDrawing);
        canvas.addEventListener('pointerout', endDrawing);
        
        await initI18n();
    }

    function toggleGuide() {
        isGuideMode = !isGuideMode;
        if (isGuideMode) {
            guideBtnIcon.className = "fa-solid fa-check-circle text-orange-500";
            guideBtnText.className = "text-orange-500";
            setTextLocalizable(guideBtnText, "guideToggleLabel", { context: "on" });
            guideBtn.classList.add('border-orange-200', 'bg-orange-50');
        } else {
            guideBtnIcon.className = "fa-regular fa-circle";
            guideBtnText.className = "";
            setTextLocalizable(guideBtnText, "guideToggleLabel", { context: "off" });
            guideBtn.classList.remove('border-orange-200', 'bg-orange-50');
        }
        resetGame();
    }

    function resizeCanvas() {
        const I_PREFER_MY_STUPID_ANIMATION_OVER_CORRECTNESS = false;
        if (I_PREFER_MY_STUPID_ANIMATION_OVER_CORRECTNESS) {
            const header = document.getElementById('header-area');
            const footer = document.getElementById('footer-area');
            
            // Calculate available space
            const windowDims = document.documentElement.getBoundingClientRect();
            
            // Subtract body padding + vertical UI element heights + vertical margin of canvas
            const uiHeight = 16 + header.getBoundingClientRect().height + footer.getBoundingClientRect().height + 16;
            const availableHeight = windowDims.height - uiHeight;
            
            // Determine the maximum possible square size (24 corresponds to px-6)
            canvasSize = Math.min(windowDims.width - 24, availableHeight);
        } else {
            // We rely on the browser's layout engine to calculate available space
            canvas.classList.add("hidden");
            canvasSize = container.getBoundingClientRect().width;
            canvas.classList.remove("hidden");
        }
        
        // Update styling params
        // Adjusted: Made the lines thinner relative to canvas size for a cleaner look
        lineWidthUser = Math.max(6, canvasSize * 0.02); 
        lineWidthGuide = lineWidthUser * 2;

        let resized = false;
        const dpr = window.devicePixelRatio || 1;
        const realCanvasSize = Math.round(canvasSize * (dpr > 1 ? dpr : 1));
        if (canvas.width != realCanvasSize || canvas.height != realCanvasSize) {
            canvas.width = realCanvasSize;
            canvas.height = realCanvasSize;
            resized = true;
        }
        
        // Set style dimensions
        canvas.style.width = `${canvasSize}px`;
        canvas.style.height = `${canvasSize}px`;
        if (I_PREFER_MY_STUPID_ANIMATION_OVER_CORRECTNESS) {
            container.style.width = `${canvasSize}px`;
            container.style.height = `${canvasSize}px`;
        }

        if (dpr > 1) {
            ctx.scale(dpr, dpr);
            canvas.classList.add("game-canvas-downscaled");
        } else {
            canvas.classList.remove("game-canvas-downscaled");
        }
        
        if (resized) {
            redrawCanvas();
        }
    }

    function redrawCanvas() {
        if (!isDrawing && points.length >= MIN_POINT_COUNT) {
            setupUserBrush();
            showResultGraphics();
        } else {
            drawHint();
            setupUserBrush();
            drawUserPainting(true);
        }
    }
    
    function drawHint(results) {
        if (isGuideMode) {
            ctx.beginPath();
            ctx.strokeStyle = results ? '#FFF7ED' : '#FED7AA'; 
            ctx.lineWidth = lineWidthGuide; 
            ctx.arc(canvasSize/2, canvasSize/2, canvasSize/3, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    class CircleGamePoint {
        constructor(x, y) {
            this.x = x;
            this.y = y;
        }
        
        static fromPhysicalCanvasPos(x, y) {
            return new this(x / canvasSize, y / canvasSize);
        }
        
        static fromPointerEvent({ clientX, clientY }) {
            const rect = canvas.getBoundingClientRect();
            return this.fromPhysicalCanvasPos(clientX - rect.left, clientY - rect.top);
        }
        
        toCanvasPos() {
            return [this.x * canvasSize, this.y * canvasSize];
        }
    }

    let startDrawingDebounce = false;
    let startDrawingDebounceTimer = null;
    function startStartDrawingDebounce() {
        endStartDrawingDebounce();
        startDrawingDebounce = true;
        startDrawingDebounceTimer = setTimeout(endStartDrawingDebounce, 50);
    }
    function endStartDrawingDebounce() {
        startDrawingDebounce = false;
        clearTimeout(startDrawingDebounceTimer);
        startDrawingDebounceTimer = null;
    }

    function setupUserBrush() {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#EFB864'; 
        ctx.lineWidth = lineWidthUser;
    }
    function clearCanvas() {
        ctx.clearRect(0, 0, canvasSize, canvasSize);
    }
    
    let currentPointer = -1;
    
    function startDrawing(e) {
        currentPointer = e.pointerId;
        
        if (!resultOverlay.classList.contains('hidden')) {
            if (startDrawingDebounce) return;
            resetGame();
        }
        endStartDrawingDebounce();
        isDrawing = true;
        points = [];
        resultOverlay.classList.add('hidden');
        resultOverlay.classList.remove('animate-fade-in-and-slide-up');
        clearCanvas();
        drawHint(); 
        
        setupUserBrush();
        ctx.beginPath();
        const pos = CircleGamePoint.fromPointerEvent(e);
        points.push(pos);
        ctx.moveTo(...pos.toCanvasPos());
    }

    function draw(e) {
        if (!isDrawing) return;
        if (currentPointer != e.pointerId) return;
        
        const pos = CircleGamePoint.fromPointerEvent(e);
        points.push(pos);
        ctx.lineTo(...pos.toCanvasPos());
        ctx.stroke();
    }

    function endDrawing(ev) {
        if (!isDrawing) return;
        if (currentPointer != ev.pointerId) return;
        
        isDrawing = false;
        if (points.length < MIN_POINT_COUNT) return;
        evaluateCircle();
    }
    
    function drawUserPainting(strokeImmediately) {
        if (points.length <= 0) return;
        ctx.beginPath();
        ctx.moveTo(...points[0].toCanvasPos());
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(...points[i].toCanvasPos());
            if (strokeImmediately)
                ctx.stroke();
        }
        if (!strokeImmediately)
            ctx.stroke();
    }

    function evaluateCircle() {
        let sumX = 0, sumY = 0;
        points.forEach(p => { sumX += p.x; sumY += p.y; });
        const centerX = sumX / points.length;
        const centerY = sumY / points.length;

        const distances = points.map(p => Math.sqrt((p.x - centerX) ** 2 + (p.y - centerY) ** 2));
        const avgRadius = distances.reduce((a, b) => a + b, 0) / distances.length;

        const safeZoneHalfWidth = avgRadius * (THICKNESS_RATIO / 2); 
        
        let errorSum = 0;
        distances.forEach(d => {
            const diff = Math.abs(d - avgRadius);
            const adjustedDiff = Math.max(0, diff - safeZoneHalfWidth);
            errorSum += adjustedDiff;
        });
        
        const errorRate = errorSum / distances.length / avgRadius;

        const start = points[0];
        const end = points[points.length - 1];
        const gap = Math.sqrt((start.x - end.x) ** 2 + (start.y - end.y) ** 2);
        const adjustedGap = Math.max(0, gap - (avgRadius * THICKNESS_RATIO));
        const gapPenalty = (adjustedGap / avgRadius) * 0.1; 

        let rawScore = 100 - (errorRate * 250 + gapPenalty * 100); 
        let score = Math.round(rawScore);
        score = Math.max(0, Math.min(100, score));

        showResult(score, centerX, centerY, avgRadius);
    }

    let [resultCx, resultCy, resultR] = [0, 0, 0];
    function showResultGraphics(cx, cy, r) {
        resultCx = cx ?? resultCx;
        resultCy = cy ?? resultCy;
        resultR = r ?? resultR;
        cx = resultCx * canvasSize;
        cy = resultCy * canvasSize;
        r = resultR * canvasSize;
        
        clearCanvas();
        drawHint(true);

        const visualThickness = r * THICKNESS_RATIO;
        ctx.strokeStyle = 'rgba(239, 184, 100, 0.4)';
        ctx.lineWidth = visualThickness;
        
        // 1. Ideal "Thick" Circle
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        // 2. XOR with User's Drawing
        ctx.globalCompositeOperation = 'xor';
        drawUserPainting();
        ctx.globalCompositeOperation = 'source-over';
        
        // --- OUTLINE LAYER ---
        ctx.beginPath();
        ctx.strokeStyle = '#F8A5C2'; 
        ctx.lineWidth = lineWidthUser * 0.4;
        ctx.setLineDash([lineWidthUser, lineWidthUser]);
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.strokeStyle = '#555';
        ctx.lineWidth = lineWidthUser * 0.6;
        drawUserPainting();
    }
    
    function showResult(score, cx, cy, r) {
        currentScore = score;
        startStartDrawingDebounce();

        showResultGraphics(cx, cy, r);

        // Update Text
        setTextLocalizable(scoreLabel, "resultScoreLabel", {
            interpolation: { count: score }
        });
        setTextLocalizable(scoreDiv, "resultScoreDisplay", {
            interpolation: { count: score }
        });
        
        let msgContext = 0;
        let colorClass = "text-gray-600";

        // Note that we assume 5 entries...
        const msgIndex = Math.floor(Math.random() * 5);
        if (score == 100) {
            msgContext = 100;
            colorClass = "text-orange-500";
            triggerConfetti(score); 
        } else if (score >= 90) {
            msgContext = 90;
            colorClass = "text-orange-400";
            triggerConfetti(score); 
        } else if (score >= 80) {
            msgContext = 80;
        } else if (score >= 60) {
            msgContext = 60;
        } else {
            msgContext = 0;
        }

        const msg = "resultComment" + msgContext + "." + msgIndex;
        currentMessage = msg;
        setTextLocalizable(messageDiv, msg);
        messageDiv.className = `font-bold whitespace-normal break-words leading-tight text-lg md:text-xl ${colorClass}`;
        
        resultOverlay.classList.remove('hidden');
        resultOverlay.classList.add('animate-fade-in-and-slide-up');
    }

    function shareTwitter() {
        const text = i18next.t("shareTweetText", {
            score: currentScore,
            message: currentMessage
        });
        const url = window.location.href; 
        const twitterUrl = new URL("https://twitter.com/intent/tweet");
        twitterUrl.searchParams.set("text", text);
        twitterUrl.searchParams.set("url", url);
        window.open(twitterUrl, '_blank');
    }

    function resetGame() {
        endStartDrawingDebounce();
        isDrawing = false;
        points = [];
        resultOverlay.classList.add('hidden');
        resultOverlay.classList.remove('animate-fade-in-and-slide-up');
        clearCanvas();
        drawHint();
    }
    
    const confettiContainer = document.getElementById("confetti-container");
    function triggerConfetti(score) {
        const colors = ['#EFB864', '#F8A5C2', '#60A5FA', '#FCD34D', '#FFFFFF']; // TODO: unhardcode these?
        const count = 100; 
        
        const newConfettis = [];
        for (let i = 0; i < count; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            confetti.style.setProperty("--tw-rotate-z", `rotateZ(${Math.random() * 360}deg)`);
            
            let shapes = ['confetti-triangle'];
            if (score >= 100) {
                shapes = ['confetti-circle', 'confetti-square', 'confetti-triangle'];
            } else if (score >= 90) {
                shapes = ['confetti-square', 'confetti-triangle'];
            }
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            confetti.classList.add(shape);

            newConfettis.push(confetti);
            confettiContainer.appendChild(confetti);
        }
        setTimeout(() => newConfettis.forEach(i => i.remove()), 3500);
    }

    document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
